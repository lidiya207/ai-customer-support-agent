[project]
name = "ai-customer-support"
version = "0.1.0"
description = "AI Customer Support Agent API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "python-dotenv",
    "pymysql>=1.2.3",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "email-validator>=2.3.0",
    "alembic>=1.20.0",
    "python-multipart>=0.0.20",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.25.0",
    "httpx",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
